; Per-directory PHP-FPM overrides for this app (NOT php.ini).
; Allows payment proof uploads up to 10MB (Laravel enforces the 10MB cap).
; Note: on Laravel Herd this is bypassed because Herd routes requests through
; its own server.php; the equivalent local setting lives in Herd's FPM pool
; config. On a normal nginx/apache + php-fpm host, this file applies as-is.
upload_max_filesize = 12M
post_max_size = 14M
